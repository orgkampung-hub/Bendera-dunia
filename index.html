<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALHUFFAZ - Flag Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="welcome-screen" class="screen">
        <div class="welcome-content-wrapper">
            <div class="welcome-header-area">
                <h1 class="logo">ALHUFFAZ</h1>
                <div class="ranking-container">
                    <h3 class="ranking-title">TOP RANKING</h3>
                    <div id="welcome-ranking-list" class="ranking-list">
                        <p>Memuatkan ranking...</p>
                    </div>
                </div>
            </div>

            <div class="welcome-action-area">
                <div class="region-grid">
                    <button onclick="startGame('asia')">ASIA 🏮</button>
                    <button onclick="startGame('europe')">EROPAH 🏰</button>
                    <button onclick="startGame('africa')">AFRIKA 🦁</button>
                    <button onclick="startGame('americas')">AMERIKA 🤠</button>
                </div>
                <button class="gallery-btn" onclick="window.location.href='gallery.html'">🏅 GALERI PENCAPAIAN</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="gameplay-wrapper">
            <div class="left-side">
                <div class="game-header">
                    <div class="stats">
                        <span id="display-region">ASIA</span> | 
                        LVL: <span id="current-level">1</span>
                    </div>
                    <div id="lives">❤️❤️❤️</div>
                </div>
                
                <div id="current-score-big">0</div>
                
                <div class="flag-container">
                    <img id="flag-img" src="" alt="Bendera">
                    <div id="message-toast" class="toast hidden"></div>
                </div>
            </div>

            <div class="right-side">
                <div id="options-container" class="options-grid"></div>
                <div class="powerups-wrapper">
                    <div class="powerups">
                        <button id="btn-5050" onclick="use5050()">⚡ 50:50 (-15)</button>
                        <button id="btn-skip" onclick="useSkip()">⏭️ SKIP (-25)</button>
                    </div>
                </div>
                <button class="home-btn" onclick="confirmHome()">🏠 MENU UTAMA</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
