<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME OVER - GAME BENDERA</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: linear-gradient(rgba(44, 62, 80, 0.9), rgba(44, 62, 80, 0.9)), url('flags.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .result-card {
      background: rgba(0, 0, 0, 0.8);
      padding: 40px 30px;
      border-radius: 25px;
      width: min(100%, 400px);
      text-align: center;
      border: 2px solid #f1c40f;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    h1 { color: #f1c40f; margin: 0; font-size: 1.2rem; letter-spacing: 2px; }
    .final-score { font-size: 4rem; font-weight: 800; color: #fff; margin: 10px 0; }
    .level-badge { background: #3498db; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    
    .badge-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 25px 0;
      min-height: 40px;
    }
    .b-tag {
      background: rgba(241, 196, 15, 0.15);
      color: #f1c40f;
      border: 1px solid #f1c40f;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    input#playerName {
      width: 100%;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 20px;
      outline: none;
    }
    input#playerName:focus { border-color: #f1c40f; background: rgba(255,255,255,0.15); }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #27ae60;
      transition: 0.2s;
    }
    .btn-submit:active { transform: translateY(3px); box-shadow: 0 2px 0 #27ae60; }
    .btn-submit:disabled { background: #7f8c8d; box-shadow: none; cursor: not-allowed; }

    .made-by { margin-top: 25px; font-size: 0.6rem; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
  </style>
</head>
<body>

<div class="result-card">
  <h1>PERMAINAN TAMAT</h1>
  <div class="final-score" id="s">0</div>
  <span class="level-badge" id="l">-</span>

  <div class="badge-container" id="bc"></div>

  <input type="text" id="playerName" placeholder="MASUKKAN NAMA ANDA" maxlength="15">
  <button onclick="save()" id="b" class="btn-submit">SIMPAN REKOD</button>
  
  <div class="made-by">made by akulas</div>
</div>

<script>
  // URL BARU V1.0.1 - Dah disahkan berfungsi
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRn-tXv1AmOeXuKnjxuqmtPdG0prMgzw2fPAa8IhLHz6glzpIdtN2tToB0TOs4Wz_V/exec";
  
  // Ambil data dari permainan sebelum ini
  const score = localStorage.getItem('lastScore') || 0;
  const level = localStorage.getItem('lastLevel') || 'Easy';
  const badges = localStorage.getItem('lastBadges') || '';

  // Papar data pada skrin
  document.getElementById('s').textContent = score;
  document.getElementById('l').textContent = level;

  // Papar lencana yang berjaya di-unlock pusingan ini
  if(badges) {
    document.getElementById('bc').innerHTML = badges.split(',')
      .map(b => b.trim())
      .filter(b => b !== "")
      .map(b => `<span class="b-tag">⭐ ${b}</span>`)
      .join('');
  }

  async function save() {
    const nameInput = document.getElementById('playerName').value.trim();
    const name = nameInput || "Pemain Misteri";
    const btn = document.getElementById('b');
    
    // Elakkan double click
    btn.disabled = true;
    btn.textContent = "SEDANG MENYIMPAN...";

    // Data yang dihantar ke Google Sheets
    const dataToSend = { 
      nama: name, 
      skor: score, 
      level: level, 
      badges: badges 
    };

    try {
      // Hantar data ke Google Apps Script
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dataToSend)
      });
      
      // Beri masa sikit untuk server proses (1.5 saat)
      setTimeout(() => {
        location.href = 'hall.html';
      }, 1500);

    } catch (e) {
      console.error("Gagal simpan:", e);
      // Kalau error pun, hantar ke hall.html supaya pemain tak sangkut
      location.href = 'hall.html';
    }
  }
</script>
</body>
</html>
